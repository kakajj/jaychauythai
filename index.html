<!doctype html><html lang="th" data-theme="pink"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#fff6f8"><meta name="apple-mobile-web-app-title" content="เจช่วยหวาน"><meta name="apple-mobile-web-app-capable" content="yes"><link id="app-manifest" rel="manifest" href="manifest.webmanifest"><link id="app-favicon" rel="icon" type="image/png" href="icons/pink/icon-192.png"><link id="app-touch-icon" rel="apple-touch-icon" href="icons/pink/icon-192.png"><link rel="stylesheet" href="style.css"><title>เจช่วยหวาน 60/40</title><script src="theme.js"></script></head><body><main id="main" tabindex="-1"><header><span class="brand">♡</span><h1>เจช่วยหวาน <span>60/40</span></h1><p>แบ่งกันจ่าย เติมความสุขให้กัน</p></header><div id="content" aria-live="polite">กำลังเปิดข้อมูล…</div></main><nav aria-label="เมนูหลัก"><button data-page="home" aria-current="page"><span>⌂</span>หน้าหลัก</button><button data-page="history"><span>▤</span>ประวัติ</button><button data-page="settings"><span>⚙</span>ตั้งค่า</button></nav><dialog id="editor" aria-labelledby="editorTitle"><form id="entry"><div class="row"><h2 id="editorTitle">ใช้สิทธิ์</h2><button type="button" class="plain" id="close" autofocus aria-label="ปิด">✕</button></div><label>ซื้ออะไร<input id="name" required maxlength="100" placeholder="เช่น กาแฟ ชาบู"></label><label>ยอดทั้งหมด (บาท)<input id="amount" inputmode="decimal" type="number" min="0.01" max="10000000" step="0.01" required placeholder="0.00"></label><label>วันที่<input id="date" type="date" required></label><label>หมายเหตุ (ไม่บังคับ)<input id="note" maxlength="300"></label><div id="preview" class="panel" aria-live="polite"></div><button class="primary" id="save">ยืนยันใช้สิทธิ์</button><button type="button" id="remove" class="danger" hidden>ลบรายการ</button></form></dialog><input type="file" id="import" accept=".json,application/json" hidden><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
